name: AIUP documentation gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aiup-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test documentation gate
        run: python3 -B -m unittest discover -s tests -p 'test_aiup_docs_gate.py'
      - name: Require documentation with behavior changes
        run: bash scripts/check-aiup-docs.sh
        env:
          AIUP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
